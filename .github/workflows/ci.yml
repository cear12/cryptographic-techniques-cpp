name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cmake:
    # Needs examples/CMakeLists.txt to register the demo as a test:
    #   add_test(NAME crypto_demo COMMAND crypto_demo)
    # and enable_testing() in the root CMakeLists.txt.
    uses: cear12/ci-workflows/.github/workflows/cmake.yml@v1
